name: Android app

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          status=0
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || status=$?
          if [ "$status" -ne 0 ]; then
            # Put the errors in one annotation so they show on the run summary without the full log.
            summary=$( { grep -A8 '^\* What went wrong' build.log; grep -E '^e: |error:|Could not (resolve|find)' build.log; } | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Build failed::${summary}"
          fi
          exit $status

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UKWaitingLists.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UKWaitingLists-apk
          path: android/UKWaitingLists.apk
