name: Release

# Builds both apps and publishes them as a GitHub release. Start it from the Actions tab
# (Release → Run workflow, then type a version like v1.2.0), or push a tag like v1.2.0.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --console=plain
      - run: cp "$(find app/build/outputs -name '*.apk' | head -1)" UKWaitingLists.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/UKWaitingLists.apk

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: >
          dotnet publish VatsimUkWaitingListWidget.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
      - run: cd publish && zip -9 ../WaitingListWidget-win-x64.zip WaitingListWidget.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: WaitingListWidget-win-x64.zip

  release:
    needs: [android, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            dist/UKWaitingLists.apk
            dist/WaitingListWidget-win-x64.zip
